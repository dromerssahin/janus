[package]
name = "janus"
version = "0.1.0"
edition = "2021"
[dependencies]
serde = { version = "1", features=["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
thiserror = "1"
statrs = "0.17"
ndarray = "0.16"
ndarray-stats = "0.6"
linfa = "0.8"
linfa-logistic = "0.8"
csv = "=1.4.0"
arrow-array = "=53.4.1"
arrow-schema = "=53.4.1"
parquet = { version = "=53.4.1", features = ["arrow"] }
duckdb = { version = "=1.2.2", features = ["bundled", "parquet"] }
sha2 = "0.10"
