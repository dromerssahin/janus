schema_version: "2"
seed: 42
episode_count: 100
variables:
  - name: baseline_severity
    outcomes:
      - {value: "1", probability: 0.5, event_day: 0, recording_day: 0}
      - {value: "2", probability: 0.5, event_day: 0, recording_day: 0}
  - name: baseline_comorbidity
    outcomes:
      - {value: "true", probability: 0.3, event_day: 0, recording_day: 0}
      - {value: "false", probability: 0.7, event_day: 0, recording_day: 0}
  - name: treatment_group
    outcomes:
      - {value: "standard", probability: 0.5, event_day: 0, recording_day: 0}
      - {value: "enhanced", probability: 0.5, event_day: 0, recording_day: 0}
  - name: exposure
    outcomes:
      - {value: "true", probability: 0.5, event_day: 0, recording_day: 0}
      - {value: "false", probability: 0.5, event_day: 0, recording_day: 0}
  - name: outcome
    parents: [exposure]
    table:
      - when: {exposure: "true"}
        outcomes:
          - {value: "true", probability: 0.8, event_day: 30, recording_day: 30}
          - {value: "false", probability: 0.2, event_day: 30, recording_day: 30}
      - when: {exposure: "false"}
        outcomes:
          - {value: "true", probability: 0.2, event_day: 30, recording_day: 30}
          - {value: "false", probability: 0.8, event_day: 30, recording_day: 30}
