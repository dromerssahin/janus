    title: Fictional follow-up
    description: Illustrative protocol duration.
    source_type: fictional_assumption
    population_context: Fictional episodes only.
    rationale: The example uses a 365-day follow-up.
    limitations: This is not clinical evidence.
    review_status: manually_curated
    links: [study.follow_up_days]
  - id: fictional-count
    title: Fictional event counts
    description: Illustrative repeated outcome count distribution.
    source_type: fictional_assumption
    population_context: Fictional episodes only.
