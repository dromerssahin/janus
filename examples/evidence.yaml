    review_status: manually_curated
    links: [generator.repeated.outcome.timing]
  - id: fictional-value
    title: Fictional outcome values
    description: Illustrative categorical distribution.
    source_type: fictional_assumption
    population_context: Fictional episodes only.
    rationale: Values exercise categorical generation.
    limitations: These probabilities are not estimates.
    review_status: manually_curated
    links: [generator.variable.outcome.value]
  - id: fictional-coverage
    title: Fictional complete observation
    description: Assumed complete coverage of follow-up.
    source_type: fictional_assumption
    population_context: Fictional episodes only.
    rationale: Coverage enables the example evaluation.
