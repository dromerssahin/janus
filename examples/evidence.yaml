    review_status: manually_curated
    links: [generator.repeated.outcome.count]
  - id: fictional-timing
    title: Fictional event timing
    description: Uniform timing within follow-up.
    source_type: fictional_assumption
    population_context: Fictional episodes only.
    rationale: Timing covers the inclusive example window.
